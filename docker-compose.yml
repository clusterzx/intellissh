version: '3.8'

services:
  intellissh:
    image: clusterzx/intellissh:latest
    container_name: intellissh
    ports:
      - 8080:3000
    volumes:
      # Mount for persistent backend data (SQLite DB, session info, etc.)
      - ./data:/app/server/data
    environment:
      # Uncomment for PostgreSQL support
      # - DB_TYPE=postgres
